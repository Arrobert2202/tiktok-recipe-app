name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json specifies and fails if the lockfile is out of sync,
      # which is the whole point of running this on a clean machine.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The build is a real check here, not ceremony: it is what catches
      # Server/Client component boundary violations and prerender errors that
      # neither tsc nor vitest can see.
      #
      # The env values below are deliberately fake. Nothing in this job talks to
      # a real service — app/sitemap.ts already swallows database failures and
      # falls back to static routes, and lib/auth.ts skips its secret check
      # during the build phase. These exist only so module-scope reads of
      # process.env don't blow up. Never point this at production.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          OPENAI_API_KEY: sk-ci-placeholder
          TRIGGER_SECRET_KEY: tr_dev_ci-placeholder
          IP_HASH_SALT: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
